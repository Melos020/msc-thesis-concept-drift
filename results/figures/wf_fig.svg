<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica,Arial,sans-serif">
<rect width="680" height="250" fill="white"/>
<text x="40" y="24" font-size="14" font-weight="bold" fill="#1F4E5F">Leakage-free walk-forward window design</text>
<text x="40" y="46" font-size="11" fill="#444">Time (hourly bars, 2018-2025)</text>
<line x1="40" y1="54" x2="640" y2="54" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
<text x="40" y="84" font-size="12" font-weight="bold" fill="#185FA5">Window 1</text>
<rect x="150" y="70" width="240" height="22" rx="5" fill="#E6F1FB" stroke="#185FA5"/><text x="270" y="85" font-size="10.5" fill="#0C447C" text-anchor="middle">train (fit model + scaler)</text>
<rect x="392" y="70" width="70" height="22" rx="5" fill="#FAEEDA" stroke="#854F0B"/><text x="427" y="85" font-size="10.5" fill="#633806" text-anchor="middle">pre</text>
<rect x="464" y="70" width="120" height="22" rx="5" fill="#FAECE7" stroke="#993C1D"/><text x="524" y="85" font-size="10.5" fill="#712B13" text-anchor="middle">post (evaluate)</text>
<text x="40" y="120" font-size="12" font-weight="bold" fill="#185FA5">Window 2</text>
<rect x="230" y="106" width="240" height="22" rx="5" fill="#E6F1FB" stroke="#185FA5"/><text x="350" y="121" font-size="10.5" fill="#0C447C" text-anchor="middle">train</text>
<rect x="472" y="106" width="70" height="22" rx="5" fill="#FAEEDA" stroke="#854F0B"/><text x="507" y="121" font-size="10.5" fill="#633806" text-anchor="middle">pre</text>
<rect x="544" y="106" width="90" height="22" rx="5" fill="#FAECE7" stroke="#993C1D"/><text x="589" y="121" font-size="10.5" fill="#712B13" text-anchor="middle">post</text>
<text x="40" y="156" font-size="12" font-weight="bold" fill="#185FA5">Window N</text>
<text x="150" y="156" font-size="11" fill="#444">window = 2400 bars, step = 400 bars (overlap handled in inference)</text>
<rect x="150" y="180" width="220" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B"/><text x="260" y="200" font-size="12" font-weight="bold" fill="#633806" text-anchor="middle">Held-out pre-drift baseline</text><text x="260" y="217" font-size="10.5" fill="#854F0B" text-anchor="middle">never used for fitting</text>
<rect x="400" y="180" width="234" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="517" y="200" font-size="12" font-weight="bold" fill="#712B13" text-anchor="middle">Degradation ratio</text><text x="517" y="217" font-size="10.5" fill="#993C1D" text-anchor="middle">pre vs post, both out-of-sample</text>
</svg>
