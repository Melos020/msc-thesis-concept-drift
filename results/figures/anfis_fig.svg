<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica,Arial,sans-serif">
<rect width="680" height="270" fill="white"/>
<text x="20" y="24" font-size="14" font-weight="bold" fill="#0F6E56">ANFIS: five-layer Takagi-Sugeno neuro-fuzzy network</text>
<text x="20" y="48" font-size="11" fill="#444">6 MI-selected features</text>
<text x="660" y="48" font-size="11" fill="#444" text-anchor="end">P(regime)</text>
<g><rect x="20" y="60" width="118" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="79" y="86" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Layer 1</text><text x="79" y="104" font-size="11" fill="#0F6E56" text-anchor="middle">Fuzzify</text><text x="79" y="120" font-size="11" fill="#0F6E56" text-anchor="middle">Gaussian MFs</text></g>
<g><rect x="158" y="60" width="118" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="217" y="86" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Layer 2</text><text x="217" y="104" font-size="11" fill="#534AB7" text-anchor="middle">Rule firing</text><text x="217" y="120" font-size="11" fill="#534AB7" text-anchor="middle">product of MFs</text></g>
<g><rect x="296" y="60" width="118" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="355" y="86" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Layer 3</text><text x="355" y="104" font-size="11" fill="#534AB7" text-anchor="middle">Normalize</text><text x="355" y="120" font-size="11" fill="#534AB7" text-anchor="middle">firing strengths</text></g>
<g><rect x="434" y="60" width="118" height="76" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="493" y="86" font-size="13" font-weight="bold" fill="#712B13" text-anchor="middle">Layer 4</text><text x="493" y="104" font-size="11" fill="#993C1D" text-anchor="middle">Consequents</text><text x="493" y="120" font-size="11" fill="#993C1D" text-anchor="middle">ridge LSE</text></g>
<g><rect x="572" y="60" width="96" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="620" y="86" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Layer 5</text><text x="620" y="104" font-size="11" fill="#5F5E5A" text-anchor="middle">Weighted</text><text x="620" y="120" font-size="11" fill="#5F5E5A" text-anchor="middle">sum output</text></g>
<g stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"><line x1="138" y1="98" x2="156" y2="98"/><line x1="276" y1="98" x2="294" y2="98"/><line x1="414" y1="98" x2="432" y2="98"/><line x1="552" y1="98" x2="570" y2="98"/></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
<rect x="20" y="170" width="300" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="170" y="192" font-size="12.5" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Premise parameters</text><text x="170" y="210" font-size="11" fill="#5F5E5A" text-anchor="middle">k-means init, fixed (train-only)</text>
<rect x="340" y="170" width="328" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="504" y="192" font-size="12.5" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Rule base</text><text x="504" y="210" font-size="11" fill="#5F5E5A" text-anchor="middle">6 features x 3 MFs, ridge lambda 1e-3</text>
</svg>
